name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Lunon Living Report lives in its own repo and is served from this
      # site at /lunon-living-report/ (its next.config sets that base path).
      - name: Check out Lunon Living Report
        uses: actions/checkout@v4
        with:
          repository: uzoway/lunon-living-report
          path: lunon-living-report

      - name: Build Lunon Living Report
        working-directory: lunon-living-report
        run: npm ci && npm run build

      - name: Add Lunon Living Report to the site
        run: cp -R lunon-living-report/out ./out/lunon-living-report

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
